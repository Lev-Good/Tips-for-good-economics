name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers when pushing source code
  schedule:
    - cron: '0 */12 * * *'  # Runs automatically every 12 hours to sync new PDFs!
  workflow_dispatch:  # Allows manual "Sync Now" button trigger from GitHub Actions tab!

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessary to commit back to the repo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Run Google Drive Sync & Index Build
        run: node scripts/sync_drive.cjs

      - name: Run YouTube Video Sync
        run: node scripts/sync-youtube.cjs

      - name: Commit and Push Synchronized Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/documents/ public/drive-data.json public/search-index.json public/videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync new documents and videos" && git push)

      - name: Build Project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
